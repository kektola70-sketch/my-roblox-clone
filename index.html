<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pocket Blox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Pocket Blox</h1>
            <input type="email" id="email" placeholder="Email (Почта)">
            <input type="password" id="password" placeholder="Пароль">
            <input type="text" id="username" placeholder="Никнейм (для новых)">
            
            <div class="buttons">
                <button onclick="register()">Создать аккаунт</button>
                <button onclick="login()" style="background:#44aa44;">Войти</button>
            </div>
            <p id="status-msg">Введите данные...</p>
        </div>
    </div>

    <!-- ИНТЕРФЕЙС ИГРЫ (Скрыт в начале) -->
    <div id="game-ui" style="display: none;">
        <div id="controls">
            <div class="btn" id="btnMove" style="background: rgba(0,0,255,0.3);"></div>
            <div class="btn" id="btnJump" style="background: rgba(255,0,0,0.3);"></div>
        </div>
        <div id="player-name">Гость</div>
    </div>

    <!-- Библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Firebase (Серверная часть) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <!-- Наш код -->
    <script src="game.js"></script>
</body>
</html>
