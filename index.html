<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pocket Blox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ВХОД -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Pocket Blox</h1>
            <!-- ВОТ ЭТОТ БЛОК ВАЖЕН ДЛЯ ЗАГРУЗКИ -->
            <div id="device-info" style="color: yellow;">Loading System...</div>
            
            <div id="auth-forms" style="display:none;">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <input type="text" id="username" placeholder="Nickname">
                <button onclick="login()" class="btn-primary">Log In</button>
                <button onclick="register()" class="btn-sec">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div id="dashboard" style="display: none;">
        <div class="header">
            <div class="avatar" id="dash-avatar">?</div>
            <div class="user-info">
                <h3 id="dash-username">Player</h3>
                <span class="status">Online</span>
            </div>
            <button onclick="logout()" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('games')">Games</button>
            <button class="tab-btn" onclick="switchTab('friends')">Connections</button>
        </div>

        <!-- ВКЛАДКА ИГРЫ -->
        <div id="tab-games" class="tab-content">
            <div id="games-list" class="games-vertical"></div>
        </div>

        <!-- ВКЛАДКА ДРУЗЬЯ (ВАЖНО!) -->
        <div id="tab-friends" class="tab-content" style="display:none;">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Find user...">
                <button onclick="searchUsers()">🔍</button>
            </div>
            <div id="search-results"></div>
            <div id="requests-list"></div>
            <h4>My Friends</h4>
            <div id="friends-list">Loading...</div>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="game-ui" style="display: none;">
        <button id="btn-exit" onclick="exitGame()">EXIT</button>
        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Chat...">
                <button onclick="sendChat()" id="btn-send">➤</button>
            </div>
        </div>
        <div id="mobile-controls">
            <div id="joystick-zone"></div>
            <div id="btnJump">⬆️</div>
        </div>
        <div id="pc-controls-hint">WASD to Move</div>
    </div>

    <!-- СКРИПТЫ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="game.js"></script>
</body>
</html>
