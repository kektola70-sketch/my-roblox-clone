<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pocket Blox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Pocket Blox</h1>
            <p id="device-info">Определение устройства...</p>
            <div id="auth-forms" style="display:none;">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Пароль">
                <input type="text" id="username" placeholder="Никнейм">
                <button onclick="login()" class="btn-primary">Войти</button>
                <button onclick="register()" class="btn-sec">Регистрация</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div id="dashboard" style="display: none;">
        <div class="header">
            <div class="avatar" id="dash-avatar">?</div>
            <h3 id="dash-username">Player</h3>
            <button onclick="logout()" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        <div class="section">
            <h3>Games</h3>
            <div id="games-list" class="games-vertical"></div>
        </div>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div id="game-ui" style="display: none;">
        <button id="btn-exit" onclick="exitGame()">EXIT</button>
        
        <!-- ЧАТ -->
        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Message...">
                <button onclick="sendChat()" id="btn-send">➤</button>
            </div>
        </div>

        <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ (Скроется на ПК) -->
        <div id="mobile-controls">
            <div id="joystick-zone"></div>
            <div id="btnJump">⬆️</div>
        </div>

        <!-- ПК ПОДСКАЗКА -->
        <div id="pc-controls-hint" style="display:none;">
            WASD - Move | SPACE - Jump | Mouse - Look
        </div>
    </div>

    <!-- БИБЛИОТЕКИ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="game.js"></script>
</body>
</html>
