<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pocket Blox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. ЭКРАН ВХОДА (SPLASH SCREEN) -->
    <div id="auth-screen">
        <div class="login-box">
            <h1>Pocket Blox</h1>
            <p id="status-text">Загрузка...</p>
            
            <div id="login-forms" style="display:none;">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Пароль">
                <input type="text" id="username" placeholder="Никнейм (только для регистрации)">
                
                <button onclick="login()" class="btn-login">Войти</button>
                <button onclick="register()" class="btn-register">Создать аккаунт</button>
            </div>
        </div>
    </div>

    <!-- 2. ИНТЕРФЕЙС ИГРЫ (Скрыт) -->
    <div id="game-ui">
        <div id="player-info">
            <div id="avatar-face">🙂</div>
            <span id="ui-username">Player</span>
        </div>

        <button id="btn-logout" onclick="logout()">Выйти</button>

        <div id="controls">
            <div class="control-btn" id="btnMove">🏃</div>
            <div class="control-btn" id="btnJump">⬆️</div>
        </div>
    </div>

    <!-- БИБЛИОТЕКИ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <!-- СКРИПТ ИГРЫ -->
    <script src="game.js"></script>
</body>
</html>
