<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rublox: Pizza Tycoon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ЗАГРУЗКА -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Rublox</h1>
            <div id="loading-text">Загрузка ресурсов...</div>
            <div id="auth-forms" style="display:none;">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Пароль">
                <input type="text" id="username" placeholder="Никнейм">
                <button onclick="login()" class="btn-primary">Войти</button>
                <button onclick="register()" class="btn-sec">Регистрация</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div id="dashboard" style="display: none;">
        <div class="top-bar">
            <div class="user-profile-mini">
                <div class="avatar" id="dash-avatar">?</div>
                <div>
                    <div id="dash-username">Гость</div>
                    <div class="currency"><i class="fas fa-coins"></i> <span id="dash-money">0</span> R$</div>
                </div>
            </div>
            <div class="top-icons">
                <button onclick="openSettings()"><i class="fas fa-cog"></i></button>
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('games')">Игры</button>
            <button class="tab-btn" onclick="switchTab('shop')">Магазин</button>
        </div>

        <div id="tab-games" class="tab-content">
            <div class="game-card-big" onclick="startGame()">
                <div class="icon">🍕</div>
                <h2>Pizza Tycoon</h2>
                <p>Кассир • Повар • Доставка • Босс</p>
                <button class="play-btn">ИГРАТЬ</button>
            </div>
        </div>

        <div id="tab-shop" class="tab-content" style="display:none;">
            <h3>Скин Персонажа</h3>
            <div id="shop-list" class="shop-grid"></div>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Настройки</h2>
            <div class="setting-item">
                <span>Звуки</span> <input type="checkbox" checked id="opt-sound">
            </div>
            <div class="setting-item">
                <span>Тени (High)</span> <input type="checkbox" checked id="opt-shadows">
            </div>
            <div class="setting-item">
                <span>Круглый скин (R15)</span> <input type="checkbox" id="opt-round-skin">
            </div>
            <button onclick="closeSettings()" class="btn-primary">Сохранить</button>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="game-ui" style="display: none;">
        <div class="game-hud">
            <div class="hud-item">💼 Очки: <span id="game-score">0</span></div>
            <div class="hud-item">💰 ЗП: <span id="pay-timer">10:00</span></div>
            <button onclick="exitGame()" class="btn-exit">МЕНЮ</button>
        </div>

        <!-- Статус доставки -->
        <div id="delivery-status" style="display:none;">📦 ПИЦЦА В РУКАХ! (Неси в дом)</div>

        <!-- ЧАТ -->
        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="...">
                <button onclick="sendChat()">➤</button>
            </div>
        </div>

        <!-- КАССА -->
        <div id="cashier-ui" style="display:none;">
            <h3>Меню Кассы</h3>
            <div class="cashier-grid">
                <button onclick="doJob('pepperoni')">🍕 Пепперони</button>
                <button onclick="doJob('cheese')">🧀 4 Сыра</button>
                <button onclick="doJob('sausage')">🌭 Сосиски</button>
                <button onclick="doJob('soda')">🥤 Газировка</button>
            </div>
            <button onclick="closeUI('cashier-ui')" class="btn-close">Закрыть</button>
        </div>

        <!-- Кнопка E -->
        <button id="action-btn" style="display:none;" onclick="doSimpleJob()">E</button>

        <div id="joystick-zone"></div>
        <div id="btnJump">⬆️</div>
    </div>

    <!-- БИБЛИОТЕКИ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="game.js"></script>
</body>
</html>
