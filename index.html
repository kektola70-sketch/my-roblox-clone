<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Work</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ВХОД -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>🍕 Pizza Work</h1>
            <div id="loading-text">Connecting...</div>
            <div id="auth-forms" style="display:none;">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Пароль">
                <input type="text" id="username" placeholder="Никнейм">
                <button onclick="login()" class="btn-primary">Войти</button>
                <button onclick="register()" class="btn-sec">Создать аккаунт</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div id="dashboard" style="display: none;">
        <div class="top-bar">
            <div class="user-info">
                <div class="avatar" id="dash-avatar">?</div>
                <div>
                    <div id="dash-username">Guest</div>
                    <div class="currency"><span id="dash-money">0</span> R$</div>
                </div>
            </div>
            <button onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        
        <div class="menu-content">
            <div class="game-card-big" onclick="startGame()">
                <div class="icon">🍕</div>
                <h2>Work at a Pizza Place</h2>
                <p>Cashier • Cook • Boxer • Delivery</p>
                <button class="play-btn">PLAY NOW</button>
            </div>
            
            <div class="shop-section">
                <h3>Avatar Shop</h3>
                <div id="shop-list" class="shop-grid"></div>
            </div>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="game-ui" style="display: none;">
        <!-- HUD Сверху -->
        <div class="game-hud">
            <div class="hud-item">💰 Paycheck: <span id="game-score">0</span> pts</div>
            <div class="hud-item">⏰ Next Pay: <span id="pay-timer">20:00</span></div>
            <button onclick="exitGame()" class="btn-exit">EXIT</button>
        </div>

        <!-- ИНТЕРФЕЙС КАССИРА (Появляется у кассы) -->
        <div id="cashier-ui" style="display:none;">
            <h3>Take Order</h3>
            <div class="cashier-grid">
                <button onclick="doJob('pepperoni')">🍕 Pepperoni</button>
                <button onclick="doJob('cheese')">🧀 4 Cheese</button>
                <button onclick="doJob('sausage')">🌭 Sausage</button>
                <button onclick="doJob('soda')">🥤 Soda</button>
            </div>
            <button onclick="closeUI('cashier-ui')" class="btn-close">Close</button>
        </div>

        <!-- КНОПКА ДЕЙСТВИЯ (Для повара/упаковщика) -->
        <button id="action-btn" style="display:none;" onclick="doSimpleJob()">INTERACT</button>

        <!-- УПРАВЛЕНИЕ -->
        <div id="joystick-zone"></div>
        <div id="btnJump">⬆️</div>
    </div>

    <!-- СКРИПТЫ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="game.js"></script>
</body>
</html>
